name: Question
description: Ask about usage, syntax, or design.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what's unclear?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: Commands, expected output, and what actually happened (if applicable).
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: fm version
      description: Output of `fm --help` first line. Skip if not version-specific.
      placeholder: v0.2.1 (abc1234)
    validations:
      required: false
